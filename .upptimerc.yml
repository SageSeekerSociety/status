owner: SageSeekerSociety
repo: status

sites:
  - name: Website
    url: https://okcheese.com
  - name: API
    url: https://okcheese.com/api/healthz
  - name: WWW
    url: https://www.okcheese.com
  # Preview content domain. An unauthenticated request is answered by the
  # backend with 401 ("Open this preview through Cheese"), so 401 means the
  # whole path to the backend is up; 502/530 mean it is not.
  - name: Previews
    url: https://preview-00000000000000000000000000000000.cheeseusercontent.com/
    expectedStatusCodes:
      - 401

status-website:
  cname: status.okcheese.com
  name: Cheese Status
  introTitle: "**Cheese** service status"
  introMessage: Live uptime and response-time history for [okcheese.com](https://okcheese.com), checked every 5 minutes from GitHub Actions. Incidents are tracked as [GitHub issues](https://github.com/SageSeekerSociety/status/issues).
  navbar:
    - title: Status
      href: /
    - title: okcheese.com
      href: https://okcheese.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
